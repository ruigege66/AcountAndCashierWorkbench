<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>会计出纳全流程管理系统</title>
<link rel="stylesheet" href="/styles.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="layout">
  <aside style="position:relative">
    <div style="padding:10px 12px;border-bottom:1px solid var(--border)">
      <input id="globalSearch" placeholder="🔍 找功能：开票 / 盘点 / 审计…" oninput="showSearchResults(this.value)"
        style="width:100%;font-size:12px" autocomplete="off">
      <div id="searchResults" style="display:none;position:absolute;left:10px;right:10px;top:52px;z-index:99;
        background:var(--card);border:1px solid var(--border);border-radius:8px;box-shadow:0 6px 20px rgba(20,40,80,.15);
        max-height:340px;overflow:auto"></div>
    </div>
    <div class="brand"><h1>📒 会计出纳系统</h1><p>Journal Pro · 全流程核算</p></div>
    <div class="group">
      <div class="group-title">我的工作 · 按四流组织</div>
      <button data-page="dashboard">工作总览</button>
      <button data-page="role_center">岗位与能力进阶</button>
      <button data-page="work_1">账务核算</button>
      <button data-page="work_2">财务与预算</button>
      <button data-page="work_3">合同法务（中级）</button>
      <button data-page="work_4">集团与战略财务</button>
      <button data-page="work_5">准则核算</button>
      <button data-page="work_6">审计鉴证</button>
      <button data-page="work_7">成本与估值</button>
      <button data-page="work_8">商事合规</button>
      <button data-page="work_9">全税种管理</button>
      <button data-page="work_10">战略与风控</button>
      <button data-page="work_11">重大项目综合</button>
    </div>
    <details style="padding:6px 12px;border-bottom:1px solid var(--border)"><summary style="cursor:pointer;font-size:12px;color:var(--muted)">按功能查找（原有菜单）</summary>
    <div class="group">
      <div class="group-title">总览</div>
      <button data-page="dashboard" class="active">工作台</button>
      <button data-page="monitor">监控大屏</button>
    </div>
    <div class="group">
      <div class="group-title">业务处理</div>
      <button data-page="docs">业务单据</button>
      <button data-page="invoices">发票管理</button>
      <button data-page="assets">固定资产</button>
      <button data-page="vouchers">凭证管理</button>
      <button data-page="journal">现金银行日记账</button>
    </div>
    <div class="group">
      <div class="group-title">监控与风控</div>
      <button data-page="risk">风险预警</button>
      <button data-page="audit">审计中心</button>
    </div>
    <div class="group">
      <div class="group-title">核对与结账</div>
      <button data-page="daily">日结核对</button>
      <button data-page="recon">银行对账</button>
      <button data-page="periods">期末结账</button>
      <button data-page="baddebt">坏账计提</button>
      <button data-page="yearend">年度结转</button>
    </div>
    <div class="group">
      <div class="group-title">效率工具 · V2.5</div>
      <button data-page="todo">待办中心</button>
      <button data-page="search">全局搜索</button>
      <button data-page="tpl">凭证模板</button>
      <button data-page="print">凭证打印</button>
      <button data-page="vcheck">凭证体检</button>
      <button data-page="stmtimport">对账单批量导入</button>
    </div>
    <div class="group">
      <div class="group-title">经营分析 · V2.5</div>
      <button data-page="cfstmt">现金流量表</button>
      <button data-page="ratios">财务比率</button>
      <button data-page="compare">同比环比</button>
      <button data-page="collection">催收清单</button>
      <button data-page="snapshots">报表归档</button>
      <button data-page="subjects">科目模板</button>
    </div>
    <div class="group">
      <div class="group-title">数据分析 · V2.6</div>
      <button data-page="analysis">在线分析报告</button>
      <button data-page="rules">分析规则配置</button>
      <button data-page="graph">功能联动关系</button>
    </div>
    <div class="group">
      <div class="group-title">V2.8 工作台</div>
      <button data-page="acct_tools">会计工具箱</button>
      <button data-page="cashier_tools">出纳工作台</button>
      <button data-page="arch_audit">架构审计中心</button>
      <button data-page="sec_center">安全中心</button>
    </div>
    <div class="group">
      <div class="group-title">能力图谱 · V2.14</div>
      <button data-page="competency_center">需求与四流追踪</button>
      <button data-page="advanced_center">高阶核算与模型</button>
    </div>
    <div class="group">
      <div class="group-title">扩展业务 · V2.13</div>
      <button data-page="legal_center">法务管理</button>
      <button data-page="audit_center">内部审计</button>
      <button data-page="reg_center">金融监管会计</button>
      <button data-page="macro_center">宏观经济会计</button>
    </div>
    <div class="group">
      <div class="group-title">外部协同 · V2.11</div>
      <button data-page="gateway_center">开票 / 网银协同</button>
    </div>
    <div class="group">
      <div class="group-title">税务 · V2.10</div>
      <button data-page="tax_center">税务中心</button>
    </div>
    <div class="group">
      <div class="group-title">查询与配置</div>
      <button data-page="reports">报表中心</button>
      <button data-page="fin">财务报表</button>
      <button data-page="partner">往来账</button>
      <button data-page="books">账簿与分析</button>
      <button data-page="compliance">内控合规</button>
      <button data-page="office">导入导出中心</button>
      <button data-page="base">基础资料</button>
      <button data-page="system">系统管理</button>
      <button data-page="help">帮助中心</button>
    </div>
    <div class="foot">前后端分离 · SQLite 持久化<br>版本化数据库迁移</div>
  </details>
</aside>
  <div class="main">
    <header>
      <div class="crumb" id="crumb">工作台</div>
      <div class="right">
        <span><span class="dot"></span><span id="dbStatus">数据库连接中…</span></span>
        <span>操作员</span><input id="actor" value="出纳" title="用于审计日志">
      </div>
    </header>
    <div class="content" id="page"><div class="empty">加载中…</div></div>
  </div>
</div>
<div class="modal-mask" id="modalMask"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<div class="impact-box" id="impactBox"></div>
<!-- 前端按职责分层加载：工具 → 页面注册表 → 交互动作 → 组合根启动 -->
<script src="/js/core.js"></script>
<script src="/js/pages_base.js"></script>
<script src="/js/pages_v25.js"></script>
<script src="/js/pages_v26.js"></script>
<script src="/js/pages_v28.js"></script>
<script src="/js/actions_base.js"></script>
<script src="/js/actions_v25.js"></script>
<script src="/js/actions_v26.js"></script>
<script src="/js/actions_v28.js"></script>
<script src="/js/pages_work.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
