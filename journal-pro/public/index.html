<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>会计出纳全流程管理系统</title>
<link rel="stylesheet" href="/styles.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="layout">
  <aside style="position:relative">
    <div style="padding:10px 12px;border-bottom:1px solid var(--border)">
      <input id="globalSearch" placeholder="🔍 找功能：开票 / 盘点 / 审计…" oninput="showSearchResults(this.value)"
        style="width:100%;font-size:12px" autocomplete="off">
      <div id="searchResults" style="display:none;position:absolute;left:10px;right:10px;top:52px;z-index:99;
        background:var(--card);border:1px solid var(--border);border-radius:8px;box-shadow:0 6px 20px rgba(20,40,80,.15);
        max-height:340px;overflow:auto"></div>
    </div>
    <details open style="border-bottom:1px solid var(--border)"><summary style="cursor:pointer;padding:9px 12px;font-size:12.5px;font-weight:500">▸ 工作台 · 按调研表 11 项工作</summary>
      <div><button data-page="dashboard" style="display:block;width:100%;text-align:left">工作总览</button><button data-page="work_1" style="display:block;width:100%;text-align:left">账务核算</button><button data-page="work_2" style="display:block;width:100%;text-align:left">财务与预算</button><button data-page="work_3" style="display:block;width:100%;text-align:left">合同法务（中级）</button><button data-page="work_4" style="display:block;width:100%;text-align:left">集团与战略财务</button><button data-page="work_5" style="display:block;width:100%;text-align:left">准则核算</button><button data-page="work_6" style="display:block;width:100%;text-align:left">审计鉴证</button><button data-page="work_7" style="display:block;width:100%;text-align:left">成本与估值</button><button data-page="work_8" style="display:block;width:100%;text-align:left">商事合规</button><button data-page="work_9" style="display:block;width:100%;text-align:left">全税种管理</button><button data-page="work_10" style="display:block;width:100%;text-align:left">战略与风控</button><button data-page="work_11" style="display:block;width:100%;text-align:left">重大项目综合</button></div></details>
    <details style="border-bottom:1px solid var(--border)"><summary style="cursor:pointer;padding:9px 12px;font-size:12.5px;font-weight:500">▸ 财务核算</summary>
      <div><button data-page="docs" style="display:block;width:100%;text-align:left">业务单据</button><button data-page="invoices" style="display:block;width:100%;text-align:left">发票管理</button><button data-page="assets" style="display:block;width:100%;text-align:left">固定资产</button><button data-page="vouchers" style="display:block;width:100%;text-align:left">凭证管理</button><button data-page="journal" style="display:block;width:100%;text-align:left">现金银行日记账</button><button data-page="books" style="display:block;width:100%;text-align:left">账簿与分析</button><button data-page="fin" style="display:block;width:100%;text-align:left">财务报表</button><button data-page="cfstmt" style="display:block;width:100%;text-align:left">现金流量表（正表）</button><button data-page="ratios" style="display:block;width:100%;text-align:left">财务比率分析</button><button data-page="compare" style="display:block;width:100%;text-align:left">同比环比分析</button><button data-page="daily" style="display:block;width:100%;text-align:left">daily</button><button data-page="recon" style="display:block;width:100%;text-align:left">recon</button><button data-page="periods" style="display:block;width:100%;text-align:left">periods</button><button data-page="baddebt" style="display:block;width:100%;text-align:left">坏账准备计提</button><button data-page="yearend" style="display:block;width:100%;text-align:left">年度结转</button><button data-page="collection" style="display:block;width:100%;text-align:left">往来催收清单</button><button data-page="partner" style="display:block;width:100%;text-align:left">往来账</button><button data-page="subjects" style="display:block;width:100%;text-align:left">会计科目模板</button></div></details>
    <details style="border-bottom:1px solid var(--border)"><summary style="cursor:pointer;padding:9px 12px;font-size:12.5px;font-weight:500">▸ 税务管理</summary>
      <div><button data-page="tax_center" style="display:block;width:100%;text-align:left">税务中心</button></div></details>
    <details style="border-bottom:1px solid var(--border)"><summary style="cursor:pointer;padding:9px 12px;font-size:12.5px;font-weight:500">▸ 数据分析</summary>
      <div><button data-page="analysis" style="display:block;width:100%;text-align:left">在线经营分析报告</button><button data-page="graph" style="display:block;width:100%;text-align:left">功能联动关系</button><button data-page="graph_map" style="display:block;width:100%;text-align:left">知识图谱（节点图）</button>
<button data-page="seven_center" style="display:block;width:100%;text-align:left">七流分析（数据/资金/工作/执行/管控/价值/合规）</button><button data-page="competency_center" style="display:block;width:100%;text-align:left">能力图谱与需求追踪</button><button data-page="advanced_center" style="display:block;width:100%;text-align:left">高阶核算与模型</button><button data-page="rules" style="display:block;width:100%;text-align:left">分析规则配置</button><button data-page="macro_center" style="display:block;width:100%;text-align:left">宏观经济会计</button></div></details>
    <details style="border-bottom:1px solid var(--border)"><summary style="cursor:pointer;padding:9px 12px;font-size:12.5px;font-weight:500">▸ 法务 · 审计 · 监管</summary>
      <div><button data-page="legal_center" style="display:block;width:100%;text-align:left">法务管理</button><button data-page="audit_center" style="display:block;width:100%;text-align:left">内部审计</button><button data-page="reg_center" style="display:block;width:100%;text-align:left">金融监管会计</button></div></details>
    <details style="border-bottom:1px solid var(--border)"><summary style="cursor:pointer;padding:9px 12px;font-size:12.5px;font-weight:500">▸ 外部协同</summary>
      <div><button data-page="gateway_center" style="display:block;width:100%;text-align:left">开票 / 网银协同</button><button data-page="stmtimport" style="display:block;width:100%;text-align:left">对账单批量导入</button><button data-page="office" style="display:block;width:100%;text-align:left">导入导出中心</button></div></details>
    <details style="border-bottom:1px solid var(--border)"><summary style="cursor:pointer;padding:9px 12px;font-size:12.5px;font-weight:500">▸ 效率工具</summary>
      <div><button data-page="todo" style="display:block;width:100%;text-align:left">我的待办中心</button><button data-page="search" style="display:block;width:100%;text-align:left">全局搜索</button><button data-page="tpl" style="display:block;width:100%;text-align:left">常用凭证模板</button><button data-page="print" style="display:block;width:100%;text-align:left">凭证打印</button><button data-page="vcheck" style="display:block;width:100%;text-align:left">凭证合规体检</button></div></details>
    <details style="border-bottom:1px solid var(--border)"><summary style="cursor:pointer;padding:9px 12px;font-size:12.5px;font-weight:500">▸ 系统与安全</summary>
      <div><button data-page="base" style="display:block;width:100%;text-align:left">基础资料</button><button data-page="system" style="display:block;width:100%;text-align:left">系统管理</button><button data-page="compliance" style="display:block;width:100%;text-align:left">内控合规</button><button data-page="risk" style="display:block;width:100%;text-align:left">风险预警</button><button data-page="audit" style="display:block;width:100%;text-align:left">审计中心（哈希链）</button><button data-page="monitor" style="display:block;width:100%;text-align:left">监控大屏</button><button data-page="sec_center" style="display:block;width:100%;text-align:left">安全中心</button><button data-page="arch_audit" style="display:block;width:100%;text-align:left">架构审计中心</button><button data-page="help" style="display:block;width:100%;text-align:left">帮助中心</button></div></details>
  </aside>
  <div class="main">
    <header>
      <div class="crumb" id="crumb">工作台</div>
      <div class="right">
        <span><span class="dot"></span><span id="dbStatus">数据库连接中…</span></span>
        <span>操作员</span><input id="actor" value="出纳" title="用于审计日志">
      </div>
    </header>
    <div class="content" id="page"><div class="empty">加载中…</div></div>
  </div>
</div>
<div class="modal-mask" id="modalMask"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<div class="impact-box" id="impactBox"></div>

<script src="/js/pages_base.js?v=1794108805"></script>
<script src="/js/pages_v25.js?v=1794108805"></script>
<script src="/js/pages_v26.js?v=1794108805"></script>
<script src="/js/pages_v28.js?v=1794108805"></script>
<script src="/js/actions_base.js?v=1794108805"></script>
<script src="/js/actions_v25.js?v=1794108805"></script>
<script src="/js/actions_v26.js?v=1794108805"></script>
<script src="/js/actions_v28.js?v=1794108805"></script>
<script src="/js/pages_work.js?v=1794108805"></script>
<script src="/js/app.js?v=1794108805"></script>
</body>
</html>
